services:
  volc-stt-adapter:
    build:
      context: .
    image: reasno/volc-stt-adapter:latest
    container_name: volc-stt-adapter
    env_file:
      - .env
    environment:
      - KWS_MODE=${KWS_MODE:-shadow}
      - KWS_MODEL_PATH=${KWS_MODEL_PATH:-/app/models/reechy-spk150-steps100k-acc98.15-rec97.50.onnx}
      - KWS_THRESHOLD=${KWS_THRESHOLD:-0.5}
      - KWS_PREROLL_SECONDS=${KWS_PREROLL_SECONDS:-1.5}
      - KWS_TRIGGER_TIMEOUT_SECONDS=${KWS_TRIGGER_TIMEOUT_SECONDS:-3}
      - KWS_SPEAKER_WINDOW_SECONDS=${KWS_SPEAKER_WINDOW_SECONDS:-30}
      - KWS_MATCH_TOLERANCE_MS=${KWS_MATCH_TOLERANCE_MS:-400}
      - KWS_QUEUE_FRAMES=${KWS_QUEUE_FRAMES:-32}
      - SPEAK_HTTP_HOST=${SPEAK_HTTP_HOST:-0.0.0.0}
      - SPEAK_HTTP_PORT=${SPEAK_HTTP_PORT:-8766}
      - SPEAK_API_TOKEN=${SPEAK_API_TOKEN:-}
      - SPEAK_TOTAL_TIMEOUT_SECONDS=${SPEAK_TOTAL_TIMEOUT_SECONDS:-45}
      - REACHY_CONVERSATION_RPC_URL=${REACHY_CONVERSATION_RPC_URL:-ws://192.168.31.94:7860/rpc}
      - REACHY_DAEMON_URL=${REACHY_DAEMON_URL:-http://192.168.31.94:8000}
      - VOLC_TTS_URL=${VOLC_TTS_URL:-wss://openspeech.bytedance.com/api/v3/tts/bidirection}
      - VOLC_TTS_RESOURCE_ID=${VOLC_TTS_RESOURCE_ID:-seed-tts-2.0}
      - VOLC_TTS_VOICE=${VOLC_TTS_VOICE:-zh_female_vv_uranus_bigtts}
      - VOLC_TTS_TIMEOUT_SECONDS=${VOLC_TTS_TIMEOUT_SECONDS:-30}
      - VOLC_TTS_MAX_AUDIO_BYTES=${VOLC_TTS_MAX_AUDIO_BYTES:-16777216}
      - DAEMON_SOUND_TIMEOUT_SECONDS=${DAEMON_SOUND_TIMEOUT_SECONDS:-10}
      - DAEMON_SOUND_CLEANUP_DELAY_SECONDS=${DAEMON_SOUND_CLEANUP_DELAY_SECONDS:-300}
    volumes:
      - /var/lib/homeassistant/homeassistant/.storage:/var/lib/homeassistant/homeassistant/.storage:ro
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "p='223D'; files=('/proc/net/tcp','/proc/net/tcp6'); assert any(line.split()[1].endswith(':'+p) and line.split()[3]=='0A' for f in files for line in open(f).read().splitlines()[1:])"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
