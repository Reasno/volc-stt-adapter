services:
  volc-stt-adapter:
    build:
      context: .
    image: reasno/volc-stt-adapter:latest
    container_name: volc-stt-adapter
    env_file:
      - .env
    environment:
      # Prefix-only wake words (comma-separated). Edit here, then
      # `docker compose up -d` to apply -- no image rebuild needed.
      - VOLC_GATE_PREFIX_WORDS=语音,微信,一起,云溪,微启,允许,机器,运气
    volumes:
      - /var/lib/homeassistant/homeassistant/.storage:/var/lib/homeassistant/homeassistant/.storage:ro
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "p='223D'; files=('/proc/net/tcp','/proc/net/tcp6'); assert any(line.split()[1].endswith(':'+p) and line.split()[3]=='0A' for f in files for line in open(f).read().splitlines()[1:])"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
