services:
  volc-stt-adapter:
    build:
      context: .
    image: reasno/volc-stt-adapter:latest
    container_name: volc-stt-adapter
    env_file:
      - .env
    environment:
      - KWS_MODE=${KWS_MODE:-shadow}
      - KWS_MODEL_PATH=${KWS_MODEL_PATH:-/app/models/reechy-spk150-steps100k-acc98.15-rec97.50.onnx}
      - KWS_THRESHOLD=${KWS_THRESHOLD:-0.5}
      - KWS_PREROLL_SECONDS=${KWS_PREROLL_SECONDS:-1.5}
      - KWS_TRIGGER_TIMEOUT_SECONDS=${KWS_TRIGGER_TIMEOUT_SECONDS:-3}
      - KWS_SPEAKER_WINDOW_SECONDS=${KWS_SPEAKER_WINDOW_SECONDS:-30}
      - KWS_MATCH_TOLERANCE_MS=${KWS_MATCH_TOLERANCE_MS:-400}
      - KWS_QUEUE_FRAMES=${KWS_QUEUE_FRAMES:-32}
    volumes:
      - /var/lib/homeassistant/homeassistant/.storage:/var/lib/homeassistant/homeassistant/.storage:ro
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "p='223D'; files=('/proc/net/tcp','/proc/net/tcp6'); assert any(line.split()[1].endswith(':'+p) and line.split()[3]=='0A' for f in files for line in open(f).read().splitlines()[1:])"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
